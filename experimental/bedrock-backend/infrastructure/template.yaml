AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: PlotTwist - AI-Powered Interactive Storytelling Application Infrastructure (AWS SAM)

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Environment stage name

  BedrockModelId:
    Type: String
    Default: us.amazon.nova-lite-v1:0
    Description: Amazon Bedrock Model ID or Cross-Region Inference Profile ARN (us.amazon.nova-lite-v1:0)

  AllowedOrigin:
    Type: String
    Default: 'http://localhost:5173'
    Description: Allowed CORS Origin for HTTP API (Set to Amplify domain in prod)

  ThrottlingRateLimit:
    Type: Number
    Default: 5
    Description: API Gateway Stage Rate Limit (requests per second)

  ThrottlingBurstLimit:
    Type: Number
    Default: 10
    Description: API Gateway Stage Burst Limit

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs20.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        ALLOWED_ORIGIN: !Ref AllowedOrigin

Resources:
  # API Gateway HTTP API with CORS and Throttling
  PlotTwistHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Api-Key

  # Story Generation Lambda Function with least-privilege Bedrock IAM policy
  PlotTwistStoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: dist/handler.handler
      Description: Generates story chapters using Amazon Bedrock Converse API based on user choices
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - 'arn:aws:bedrock:*::foundation-model/*'
                - 'arn:aws:bedrock:*:*:inference-profile/*'
      Events:
        StoryEndpoint:
          Type: HttpApi
          Properties:
            ApiId: !Ref PlotTwistHttpApi
            Path: /story
            Method: post

Outputs:
  PlotTwistApiEndpoint:
    Description: API Gateway HTTP API endpoint URL for PlotTwist backend
    Value: !Sub "https://${PlotTwistHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/story"
  PlotTwistFunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt PlotTwistStoryFunction.Arn
